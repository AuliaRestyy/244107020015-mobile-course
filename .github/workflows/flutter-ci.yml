name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "05-week-5-local-storage-offline-first/week5_offline_notes/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "05-week-5-local-storage-offline-first/week5_offline_notes/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 05-week-5-local-storage-offline-first/week5_offline_notes

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            05-week-5-local-storage-offline-first/week5_offline_notes/build/app/outputs/flutter-apk/app-release.apk
            05-week-5-local-storage-offline-first/week5_offline_notes/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
