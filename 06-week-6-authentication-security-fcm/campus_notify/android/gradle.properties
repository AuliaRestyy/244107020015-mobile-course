org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Plugin sources live in the pub cache on C: while this project is on D:.
# Kotlin's incremental caches relativize paths against the module root and throw
# "this and base files have different roots" across Windows drives, which fails
# the build with "Could not close incremental caches". Incremental Kotlin
# compilation must stay off until the project and pub cache share a drive.
kotlin.incremental=false
